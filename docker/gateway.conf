# Minimal stand-in for the Kong gateway of a hosted Supabase project.
#
# backend/app/services/supabase.py builds every URL as `{SUPABASE_URL}/rest/v1/...`
# and `{SUPABASE_URL}/storage/v1/object/...`, so PostgREST and storage-api have to
# answer on a single origin. The trailing slash on each proxy_pass strips the
# location prefix, exactly as Supabase's own gateway does.

server {
    listen 8000;
    server_name _;

    # Photos arrive as base64 data URLs re-encoded to binary; keep headroom over
    # the 10 MB bucket limit declared in backend/data/supabase_schema.sql.
    client_max_body_size 20m;

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/v1/ {
        proxy_pass http://storage:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # storage-api runs with REQUEST_ALLOW_X_FORWARDED_PATH, so this is how it
        # learns the public prefix it is mounted under when it builds URLs.
        proxy_set_header X-Forwarded-Path /storage/v1;
    }

    # Cheap liveness probe for humans and for the compose healthcheck.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
