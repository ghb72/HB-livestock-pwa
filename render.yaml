services:
  - type: web
    name: livestock-register-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_SCHEMA
        value: public
      - key: SUPABASE_STORAGE_BUCKET
        value: livestock
      - key: SUPABASE_STORAGE_PREFIX
        value: cattle-photos
      - key: AUTH_TOKEN
        sync: false
